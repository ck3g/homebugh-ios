name: main

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  tests:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install xcbeautify
      run: brew list xcbeautify &>/dev/null || brew install xcbeautify

    - name: List available simulators
      run: xcrun simctl list devices available

    - name: Select iPhone simulator
      id: sim
      run: |
        UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; devices=json.load(sys.stdin)['devices']; phones=[d for rt,l in devices.items() if 'iOS' in rt for d in l if d.get('isAvailable') and d['name'].startswith('iPhone')]; print(phones[0]['udid'] if phones else '')")
        if [ -z "$UDID" ]; then
          echo "No available iPhone simulator found" >&2
          exit 1
        fi
        echo "Using simulator UDID: $UDID"
        echo "udid=$UDID" >> "$GITHUB_OUTPUT"

    - name: Build and Test
      run: set -o pipefail && xcodebuild clean test -project HomeBugh.xcodeproj -scheme HomeBugh -sdk iphonesimulator -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" | xcbeautify

